[build-system]
# Build the package with [Flit](https://flit.pypa.io/)
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "prepmd"
dynamic = ["version"]
description = "Automatically prepare PDB and mmCIF structures for molecular dynamics simulations."
authors = [
    { name = "Rob Welch", email = "robert.welch@stfc.ac.uk" },
    { name = "Harry Swift", email = "harry.swift@stfc.ac.uk" },
    { name = "Jas Kalayan", email = "jas.kalayan@stfc.ac.uk" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests",
    "openmm",
    "pdbfixer",
    "biopython",
    "pdb2pqr",
    "MDAnalysis",
    "rdkit",
    "openmmforcefields",
]

[project.urls]
Homepage = "https://github.com/CCPBioSim/prepmd"
Repository = "https://github.com/CCPBioSim/prepmd"
Documentation = "https://prepmd.readthedocs.io/en/latest/"

[project.optional-dependencies]
docs = [
    "sphinx>=9,<10",
    "nbsphinx>=0.9,<1.0",
    "sphinx-rtd-theme>=3,<3.2",
    "sphinx-copybutton>=0.5,<1.0",
    "sphinxcontrib-contentui>=0.2,<1.0",
    "sphinxcontrib-details-directive>=0.1,<1.0",
    "furo>=2025.0,<2026.0",
    "markupsafe>=3.0,<4.0",
    "myst-parser",
]

[project.scripts]
prepmd = "prepmd.prep:entry_point"
runmd = "prepmd.run:entry_point"
prep-license = "prepmd.add_modeller_license:entry_point"
