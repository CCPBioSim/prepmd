# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: prepmd CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  tests:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15] # no antechamber on windows-2025 :(
        python-version: ["3.13"]

    #env:
      #KEY_MODELLER: ${{ secrets.MODELLER_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5.0.0

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/.conda/pkgs
          key: ${{ runner.os }}-conda-${{ hashFiles('environment.yaml') }}
          restore-keys: |
            ${{ runner.os }}-conda-

      - name: Set up Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          use-mamba: true
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yaml
          activate-environment: prep
          auto-update-conda: true
          auto-activate-base: false

      - name: Verify environment
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: Install package and test dependencies
        shell: bash -l {0}
        run: |
          which pip
          pip install -e .
          pip install pytest-cov
          conda list

      - name: Run test suite with coverage
        shell: bash -l {0}
        run: |
          pytest -v --cov=prepmd --cov-report=term-missing --cov-report=lcov

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          flag-name: ${{ matrix.os }}-py${{ matrix.python-version }}
          parallel: true
          fail-on-error: false

  coveralls:
    name: Finalise Coveralls
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true