name: Weekly Unit Tests

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: prepmd
      python-versions: '["3.13"]'
      coverage-python-version: "3.13"
      os: '["ubuntu-26.04", "macos-26"]'
      environment-file: environment.yaml
      activate-environment: prep
      channels: salilab,conda-forge
      test-path: test
      pytest-args: -v
      timeout-minutes: 360
