name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: CCPBioSim/.github/.github/workflows/ci-test-conda.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
      checks: write
      statuses: write
    with:
      package: prepmd
      python-versions: '["3.13"]'
      coverage-python-version: "3.13"
      os: '["ubuntu-26.04", "macos-26"]'
      environment-file: environment.yaml
      activate-environment: prep
      channels: salilab,conda-forge
      test-path: test
      pytest-args: -v
      coverage: true
      timeout-minutes: 120

  docs:
    name: Docs
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      python-versions: '["3.13"]'
      build-dir: build
      timeout-minutes: 20

  pre-commit:
    name: Pre-commit
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      python-version: "3.13"
      timeout-minutes: 15

  conda-build:
    name: Conda build
    needs: unit
    uses: CCPBioSim/.github/.github/workflows/ci-conda-build.yaml@2bf63339f2515ec54777e952e8db3d8674d4e5ca # 0.14.0
    permissions:
      contents: read
    with:
      python-versions: '["3.13"]'
      timeout-minutes: 120
